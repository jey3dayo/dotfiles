name: CI - Format and Lint

on:
  push:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.lua"
      - "**/*.sh"
      - "**/*.ps1"
      - "**/*.zsh"
      - "zsh/.zlogin"
      - "zsh/.zprofile"
      - "zsh/.zshenv"
      - "zsh/.zshrc"
      - "**/*.ts"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.mts"
      - "**/*.jsx"
      - "**/*.tsx"
      - "bin/**"
      - "zsh/bin/**"
      - "**/*.json"
      - "**/*.jsonc"
      - "biome.json"
      - "stylua.toml"
      - ".styluaignore"
      - ".mise.toml"
      - "mise.toml"
      - "mise/**/*.toml"
      - ".markdown-link-check.json"
      - ".prettierignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/actions.lock"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.lua"
      - "**/*.sh"
      - "**/*.ps1"
      - "**/*.zsh"
      - "zsh/.zlogin"
      - "zsh/.zprofile"
      - "zsh/.zshenv"
      - "zsh/.zshrc"
      - "**/*.ts"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.mts"
      - "**/*.jsx"
      - "**/*.tsx"
      - "bin/**"
      - "zsh/bin/**"
      - "**/*.json"
      - "**/*.jsonc"
      - "biome.json"
      - "stylua.toml"
      - ".styluaignore"
      - ".mise.toml"
      - "mise.toml"
      - "mise/**/*.toml"
      - ".markdown-link-check.json"
      - ".prettierignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/actions.lock"
  workflow_dispatch:

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    env:
      # CI-optimized config selection via MISE_ENV (entry goes last so entry settings win)
      # Uses standard global config discovery (~/.config/mise/config.<env>.toml)
      MISE_ENV: "bun,ci"
      # This repository defines tasks in `.mise.toml`; force mise to resolve that filename.
      # `MISE_DEFAULT_CONFIG_FILENAME` is for older mise versions.
      MISE_DEFAULT_CONFIG_FILENAME: ".mise.toml"
      # `MISE_OVERRIDE_CONFIG_FILENAMES` is for newer mise versions.
      MISE_OVERRIDE_CONFIG_FILENAMES: ".mise.toml"
      # Relax network hiccups when fetching tool version metadata
      MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: "60"
      # Use GitHub Actions Lua/LuaRocks instead of mise-managed installs
      MISE_DISABLE_TOOLS: "lua,luajit"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Mirror checkout into $HOME/.config
        run: |
          # `mise/local-tasks/*.toml` assumes this repo is deployed at
          # `$HOME/.config` (see docs/setup.md's `git clone ... ~/.config`
          # bootstrap): it sources helper scripts from
          # `$HOME/.config/mise/lib/*.sh` and runs several tasks with
          # `dir = "~/.config"`. Mirror the checkout there so CI matches
          # that layout (fd does not follow symlinks, so a real copy is
          # required, not a symlink farm).
          mkdir -p "$HOME/.config"
          cp -a "$GITHUB_WORKSPACE/." "$HOME/.config/"

      - name: Prepare mise task include path
        run: |
          # `.mise.toml` includes task files under `.config/mise/local-tasks/*`.
          # In CI checkout directories, this path does not exist by default.
          # Mirror local layout so older mise versions can resolve task definitions.
          [ -e .config ] || ln -s . .config

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh libreadline-dev libncurses5-dev

      - name: Import Node.js release key
        run: |
          gpg --keyserver keyserver.ubuntu.com --recv-keys 86C8D74642E67846F8E120284DAA80D1E737BC9F

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10

      - name: Set up mise
        uses: jdx/mise-action@v5.2.4
        with:
          # mise dotfiles / bootstrap を使うため 2026.7 以降が必要
          version: "2026.7.5"
          cache: true

      - name: Set up Lua 5.4 for luacheck
        uses: leafo/gh-actions-lua@v13.1.0
        with:
          # v13 で既定が 5.5 に変わったため、v12 までの既定（5.4）を明示して維持する
          luaVersion: "5.4"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6.1.1

      - name: Cache LuaRocks packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.luarocks
          key: luarocks-${{ runner.os }}-${{ hashFiles('**/.mise.toml', '**/mise.toml') }}
          restore-keys: |
            luarocks-${{ runner.os }}-

      - name: Install LuaRocks packages
        run: |
          luarocks install --local luacheck
          luarocks install --local busted

      - name: Add LuaRocks bin to PATH
        run: echo "${HOME}/.luarocks/bin" >> "$GITHUB_PATH"

      - name: Deploy dotfiles with mise bootstrap
        run: mise run ci:verify-deploy

      - name: Run all CI checks
        run: mise run ci
