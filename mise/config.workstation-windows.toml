# Windows ワークステーション固有の settings と tools (MISE_ENV で最後に選択して優先)

[settings]
# entry 固有 settings（共通 settings は config.toml）
idiomatic_version_file_enable_tools = []
trusted_config_paths = ["~/.config", "~/src/github.com"]
windows_default_inline_shell_args = "cmd /c"
windows_default_file_shell_args = "cmd /c"

[env]
YAMLLINT_CONFIG_FILE = "yamllint/config"
MD_GLOB = "**/*.md"
MD_EXCLUDES = "#node_modules #.worktrees #.apm/skills #.claude/skills #.claude/worktrees #.codex/skills #result #result-* #tmp #.kiro #opencode/agents/*.md #opencode/commands/*.md"
TASK_EXCLUDES = "--exclude .worktrees --exclude .apm/skills --exclude .claude/skills --exclude .claude/worktrees --exclude .codex/skills --exclude result --exclude tmp --exclude .luarocks --exclude .kiro --exclude opencode/agents --exclude opencode/commands --exclude apm.lock.yaml --exclude codexbar"

[tools]
# 共通 tools: conf.d/00-tools-common.toml（shellcheck / shfmt / yamllint は registry が Windows でも aqua / pipx に解決する）
# Shared tools: config.shared.toml / config.workstation.toml (via MISE_ENV)
