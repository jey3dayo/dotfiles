# 環境共通設定。ツール定義は OS 別ファイル（config.default.toml / config.windows.toml / config.pi.toml）
# MISE_CONFIG_FILE で選択される。

[settings]
env_file = '.env.local'
experimental = true
# jobs / idiomatic_version_file_enable_tools は OS 別ファイルで定義
# （ここに置くと OS 別ファイルより優先されてしまう）
disable_backends = ["vfox"]
# サプライチェーン対策: リリース直後のバージョンへの upgrade を抑止する
minimum_release_age = "1d"
minimum_release_age_excludes = [
  "npm:hunkdiff",
  "npm:@openai/codex",
  "npm:@earendil-works/pi-coding-agent",
  "github:yusukebe/ax",
]

[settings.github]
# GitHub 匿名 API レート制限対策として Keychain の git 認証情報をフォールバック利用
use_git_credentials = true

[settings.pipx]
uvx = true

[settings.npm]
package_manager = "pnpm"

[env]
_.source = [".venv/bin/activate"]
YAMLLINT_CONFIG_FILE = "yamllint/config"
MD_GLOB = "**/*.md"
# MD_EXCLUDES は markdownlint の否定パターン。`#` 前置のためシェルの pathname expansion で展開されない。
MD_EXCLUDES = "#node_modules #fisher #zsh/.zinit #.worktrees #.apm/skills #.claude/skills #.claude/worktrees #.codex/skills #result #result-* #tmp #.kiro #opencode/agents/*.md #opencode/commands/*.md"
# TASK_EXCLUDES はタスク側で unquoted 展開して fd の引数列にするため、glob 文字を含めてはならない。
# 含めると実ファイルへ pathname expansion され、`--exclude` と値のペアが崩れて fd が余りを検索パスと解釈する。
# result / result-* は .gitignore が担うので fd 側の除外は不要。ディレクトリ単位の除外はルート起点で書く。
TASK_EXCLUDES = "--exclude .worktrees --exclude .apm/skills --exclude .claude/skills --exclude .claude/worktrees --exclude .codex/skills --exclude result --exclude tmp --exclude .luarocks --exclude .kiro --exclude opencode/agents --exclude opencode/commands --exclude apm.lock.yaml --exclude codexbar"

# OS 非依存の dotfiles 配布（mise bootstrap / mise dotfiles apply で適用）
# macOS 専用分は config.macos.toml に定義（MISE_ENV=macos でロード）
[dotfiles]
"~/.zshenv" = { source = "~/.config/home/.zshenv", mode = "symlink" }
"~/.bashrc" = { source = "~/.config/bash/.bashrc", mode = "symlink" }
"~/.bash_profile" = { source = "~/.config/bash/.bash_profile", mode = "symlink" }
"~/.ssh/config" = { source = "~/.config/ssh/config", mode = "symlink" }
"~/.terraformrc" = { source = "~/.config/terraform/terraformrc", mode = "symlink" }
# symlink を拒否する CLI 向けは copy
"~/.aicommits" = { source = "~/.config/.aicommits", mode = "copy" }
"~/.opencommit" = { source = "~/.config/opencommit/.opencommit", mode = "copy" }
