# CI entry (MISE_CONFIG_FILE で選択)。overlay なし（shared/workstation を読まない）。

[settings]
jobs = 4                                                                         # GitHub Actions: 2-core runners
idiomatic_version_file_enable_tools = []
trusted_config_paths = ["~/.config", "~/src/github.com", "/private/var/folders"]

[env]
YAMLLINT_CONFIG_FILE = "yamllint/config"
MD_GLOB = "**/*.md"
MD_EXCLUDES = "#node_modules #fisher #zsh/.zinit #.worktrees #.apm/skills #.claude/skills #.claude/worktrees #.codex/skills #result #result-* #tmp #.kiro #opencode/agents/*.md #opencode/commands/*.md"
TASK_EXCLUDES = "--exclude .worktrees --exclude .apm/skills --exclude .claude/skills --exclude .claude/worktrees --exclude .codex/skills --exclude result --exclude tmp --exclude .luarocks --exclude .kiro --exclude opencode/agents --exclude opencode/commands --exclude apm.lock.yaml --exclude codexbar"

[tools]
# Language Runtimes
node = "lts"
bun = "latest"

# Package Managers
"github:astral-sh/uv" = "latest" # uvx for ruff (pipx:uv は自己参照更新で停滞）

# Formatters / Linters
"github:jdx/jactionlint" = "2.3.0"
biome = "latest"
prettier = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
taplo = "latest"
yamllint = "latest"
"pipx:beautysh" = "latest"

# CLI Tools
fd = "latest"
gitleaks = "latest"

# NPM Packages
"npm:markdown-link-check" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:tsx" = "latest"
