# 読む環境: macOS, Linux/WSL2, Windows（開発機）。MISE_ENV=dev。[tools] のみ
# Windows も読むため PATH 長（cmd 上限 8191）の上限テスト対象。Windows に不要な tool は config.dev-posix.toml へ

[tools]
# Language Runtimes
python = "3.15"
rust = "stable" # rustfmt (nvim conform) and cargo:* tool installs

# CLI Tools
bat = "latest"
delta = "latest"
fzf = "latest"
lazygit = "latest"
ripgrep = "latest"
usage = "latest"
zoxide = "latest"
"pipx:apm-cli" = "0.35.1"
"aqua:evilmartians/lefthook" = "latest"

# Rust Packages
"cargo:bandwhich" = "latest"
"cargo:needle-cli" = "0.15.0"
"cargo:similarity-ts" = "0.5.0"
"cargo:starship" = "latest"
"cargo:wrkflw" = "0.8.0"

# NPM Packages
"npm:@fsouza/prettierd" = "latest"
"npm:agent-browser" = "latest"
"npm:dev-browser" = "latest"
"npm:eslint_d" = "latest"
"npm:greptile" = "latest"
"npm:neovim" = "latest"
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:zx" = "latest"
"npm:@google/clasp" = "latest"

# MCP サーバー
"npm:@playwright/mcp" = "latest"
