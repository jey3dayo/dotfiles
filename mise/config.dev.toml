# 読む環境: macOS, Linux/WSL2, Windows（開発機）。MISE_ENV=dev。[tools] のみ
# 対象: macOS, Linux/WSL2, Windows の 3 環境で使う tool。macOS, Linux/WSL2 だけで使う tool は config.dev-posix.toml

[tools]
# Language Runtimes
python = "3.15"

# CLI Tools
delta = "latest"
lazygit = "latest"
ripgrep = "latest"
usage = "latest"
zoxide = "latest"
"pipx:apm-cli" = "0.35.1"
"aqua:evilmartians/lefthook" = "latest"

# NPM Packages
"npm:@fsouza/prettierd" = "latest"
"npm:agent-browser" = "latest"
"npm:eslint_d" = "latest"
"npm:greptile" = "latest"
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:@google/clasp" = "latest"
