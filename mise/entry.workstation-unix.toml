# macOS/Linux/WSL2 workstation entry (MISE_CONFIG_FILE で選択)。overlay は MISE_ENV 経由。

[settings]
jobs = 8
idiomatic_version_file_enable_tools = []
trusted_config_paths = [
  "~/.config",
  "~/src/github.com",
  "/private/var/folders",
] # /private/var/folders: macOS TMPDIR 配下の worktree/sandbox 用

[settings.github]
# gh keychain token 取得（shim 経由だと無限再帰、実 binary を絶対パス指定）
credential_command = '"$HOME/.mise/installs/github-cli-cli/latest/bin/gh" auth token --hostname "$MISE_CREDENTIAL_HOST"'

[tools]
# Language Runtimes
deno = "latest"
julia = "latest"

# Formatters / Linters
"aqua:reteps/dockerfmt" = "latest"
hadolint = "latest"
shellcheck = "latest"
shfmt = "latest"
yamllint = "latest"

# CLI Tools
atuin = "latest"
aws-cli = "latest"
buf = "latest"
ghq = "latest"
glab = "latest"
hexyl = "latest"
jnv = "latest"
kubectl = "latest"
marksman = "latest"
openfga = "latest"
pandoc = "latest"
restic = "latest"
saml2aws = "latest"
sheldon = "latest"
task = "latest"
terraform = "latest"
tilt = "latest"
tmux = "latest"
trivy = "latest"
typos = "latest"
vector = "latest"
yq = "latest"
"pipx:awsume" = "latest"
"aqua:fujiwara/lambroll" = "latest"
"aqua:getsentry/sentry-cli" = "latest"
"aqua:github/copilot-cli" = "latest"
"aqua:golangci/golangci-lint" = "latest"
"aqua:k1LoW/git-wt" = "latest"
"github:agavra/tuicr" = "latest"
"github:yusukebe/ax" = "latest"
"github:zenbu-labs/terminal-browser" = "latest"

# Go Packages
"go:github.com/google/wire/cmd/wire" = "latest"
"go:github.com/hashicorp/terraform-mcp-server/cmd/terraform-mcp-server" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"

# Rust Packages
"cargo:similarity-css" = "0.5.0"
"cargo:tree-sitter-cli" = { version = "0.27.1", default-features = "false" } # WSL glibc 不整合対策: cargo backend を default-features=false で使用

# NPM Packages
"npm:@anthropic-ai/dxt" = "latest"
"npm:@deepseek-ai/dsh" = "0.2.0-rc.2"
"npm:agmsg" = "latest"
"npm:ccstatusline" = "latest"
"npm:chrome-devtools-mcp" = "latest"
"npm:dbdocs" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-json-languageserver" = "latest"

[bootstrap.hooks.post-tools]
run = "sh ~/.config/mise/lib/ensure-standalone.sh" # claude / codex / herdr の自己更新 CLI 導入保証

[bootstrap.hooks.final]
run = "sh ~/.config/mise/lib/ensure-python-libs.sh" # import ライブラリ導入保証（pipx 隔離対象外）
