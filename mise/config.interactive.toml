# 読む環境: macOS, Linux/WSL2, Windows, Pi（CI 以外 = 人が使うマシン）。MISE_ENV=interactive

[tools]
# Language Runtimes
go = "latest"

# Package Managers
# pnpm は npm backend の package_manager として必須。loose major pin にし、正確な版は各 repo の package.json packageManager が持つ
pnpm = "12"

# CLI Tools
eza = "latest"
"github:cli/cli" = "latest"
"github:pranshuparmar/witr" = "latest"
jq = "latest"
yazi = "latest"

# NPM Packages
"npm:@antfu/ni" = "latest"
"npm:@dotenvx/dotenvx" = "latest"
"npm:@google/design.md" = "latest"
"npm:@sasazame/ccresume" = "latest"
"npm:@upstash/context7-mcp" = "latest"
"npm:aicommits" = "latest"
"npm:npm-check-updates" = "latest"
"npm:textlint" = "latest"
"npm:textlint-rule-preset-ja-technical-writing" = "latest"
