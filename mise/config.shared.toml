# 3-OS 共通 tools (macOS/Linux/WSL2, Windows, Pi)。MISE_ENV に shared を含む環境でロード。

[tools]
# Language Runtimes
go = "latest"
node = "lts"

# Package Managers
"github:astral-sh/uv" = "latest"
pnpm = "12"                      # npm backend の package_manager。major pin のみ（各 repo の packageManager が exact 版を持つ）

# Formatters / Linters
"github:jdx/jactionlint" = "2.3.0" # rhysd/actionlint 後継。破壊的変更があるため pin（更新時に attestation 確認）
biome = "latest"
prettier = "latest"
"pipx:beautysh" = "latest"
stylua = "latest"
taplo = "latest"

# CLI Tools
eza = "latest"
fd = "latest"
gitleaks = "latest"
"github:cli/cli" = "latest"
"github:pranshuparmar/witr" = "latest"
jq = "latest"
yazi = "latest"

# NPM Packages
"npm:@antfu/ni" = "latest"
"npm:@dotenvx/dotenvx" = "latest"
"npm:@google/design.md" = "latest"
"npm:@sasazame/ccresume" = "latest"
"npm:@upstash/context7-mcp" = "latest"
"npm:aicommits" = "latest"
"npm:markdown-link-check" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:npm-check-updates" = "latest"
"npm:o3-search-mcp" = "latest"
"npm:opencommit" = "latest"
"npm:textlint" = "latest"
"npm:textlint-rule-preset-ja-technical-writing" = "latest"
"npm:tsx" = "latest"
