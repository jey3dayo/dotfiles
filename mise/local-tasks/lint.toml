# ========================================
# Lint Tasks
# ========================================
# コード品質チェックタスク（チェックのみ、修正なし）
# フォーマット判定は基本的に format:*:check へ集約
# 各タスクは環境変数で対象ファイルを限定可能

["lint:biome"]
description = "JS/TS/JSON ファイルをチェック（BIOME_FILES で対象を限定可能）"
run = "bash ./mise/lib/lint-code.sh biome"

["lint:markdown"]
description = "Markdown ファイルをチェック"
run = """
markdownlint-cli2 "${MD_GLOB}" ${MD_EXCLUDES}
"""

["lint:yaml"]
description = "YAML ファイルをチェック（yamllint、YAML_FILES で対象を限定可能）"
run = "bash ./mise/lib/lint-code.sh yaml"

["lint:python"]
description = "Python ファイルをチェック（PY_FILES で対象を限定可能）"
run = "bash ./mise/lib/lint-code.sh python"

["lint:shell"]
description = "シェルスクリプトをチェック（SH_FILES で対象を限定可能）"
run = "bash ./mise/lib/lint-shell.sh"

["lint:dockerfile"]
description = "Dockerfile をチェック（hadolint、--no-color オプション付き）"
run = "bash ./mise/lib/lint-code.sh dockerfile"

["lint:links"]
description = "Markdown リンクチェック（時間がかかるため個別実行推奨）"
run = "fd -e md ${TASK_EXCLUDES} -x markdown-link-check --config ${MARKDOWN_LINK_CONFIG} -q"

["lint:actions"]
description = "GitHub Actions ワークフローをチェック（jactionlint）"
run = """
jactionlint
"""

# .github/workflows/actions.lock は手で編集せず、このタスクで再生成する。
["actions-lock:generate"]
description = "actions.lock を再生成し、upstream で検証する（gh のログインが必要）"
run = [
  "gh-actions-lock --migrate-local-actions --no-interactive",
  "gh-actions-lock --verify",
]

["actions-lock:verify"]
description = "オフライン検査: すべての uses: に actions.lock の entry があり、lockfile が読める"
run = "gh-actions-lock --verify-local"

["lint:lua"]
description = "Lua ファイルをチェック（luacheck）"
depends = ["lint:lua:luacheck"]

["lint:lua:luacheck"]
description = "luacheck を実行（必須）"
run = "bash ./mise/lib/lint-code.sh lua"
