# ========================================
# Environment Variable Management (dotenvx)
# ========================================

["setup-env"]
description = ".env を .env.local に復号化（mise hooks から自動実行）"
run = "scripts/setup-env.sh"
run_windows = '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/windows/setup-env.ps1'

["env:encrypt"]
description = "環境変数ファイルを暗号化"
run = "dotenvx encrypt -f ${XDG_CONFIG_HOME:-$HOME/.config}/.env"

["env:decrypt"]
description = "環境変数ファイルを復号化"
run = "DOTENV_PRIVATE_KEY_PATH=${XDG_CONFIG_HOME:-$HOME/.config}/.env.keys dotenvx decrypt -f ${XDG_CONFIG_HOME:-$HOME/.config}/.env"

["env:print"]
description = "復号済み環境変数を標準出力に表示（ファイルは書き換えない）"
# dotenvx はプロセス環境変数をファイルの値より優先するため、mise の env_file 注入
# (.env.local) を引き継ぐと古い値が表示される。env -i + shim 迂回で .env の値だけを出す
run = 'env -i PATH=/opt/homebrew/bin:/usr/bin:/bin DOTENV_PRIVATE_KEY_PATH=${XDG_CONFIG_HOME:-$HOME/.config}/.env.keys "$(mise which dotenvx)" decrypt -f ${XDG_CONFIG_HOME:-$HOME/.config}/.env --stdout'

["env:detect"]
description = "現在の環境タイプを検出（CI/Pi/Default）"
run = "scripts/env-detect.sh"
