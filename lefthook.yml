# lefthook が見つからないと生成 hook は既定で gate 無しに通すため、hard fail させる。
assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: stylua
      glob: "*.lua"
      run: stylua {staged_files}
      stage_fixed: true
    - name: luacheck
      glob: "*.lua"
      run: luacheck -q {staged_files}
    - name: shfmt
      glob: "*.sh"
      run: shfmt -w -i 2 -ci -bn {staged_files}
      stage_fixed: true
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
    - name: beautysh
      glob:
        - "*.zsh"
        - ".zshrc"
        - ".zshenv"
        - ".zprofile"
        - ".zlogin"
        - ".zlogout"
        - "zsh/bin/**"
      run: beautysh -i 2 {staged_files}
      stage_fixed: true
    - name: zsh-syntax
      glob:
        - "*.zsh"
        - ".zshrc"
        - ".zshenv"
        - ".zprofile"
        - ".zlogin"
        - ".zlogout"
        - "zsh/bin/**"
      run: zsh -n {staged_files}
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: yamllint -f parsable {staged_files}
    - name: markdown-bold-headings
      glob: "agents/src/**/*.md"
      run: tsx ./scripts/replace-bold-headings.ts {staged_files}
      stage_fixed: true
    - name: markdownlint
      glob: "*.md"
      run: markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: prettier --write --ignore-unknown --log-level error {staged_files}
      stage_fixed: true
    - name: ruff-format
      glob: "*.py"
      run: uvx ruff format {staged_files}
      stage_fixed: true
    - name: ruff-check
      glob: "*.py"
      run: uvx ruff check --fix {staged_files}
      stage_fixed: true
    - name: taplo
      glob: "*.toml"
      run: taplo format {staged_files}
      stage_fixed: true
    - name: jactionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: jactionlint {staged_files}
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json}"
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: hadolint
      glob: "Dockerfile*"
      run: hadolint --no-color {staged_files}
    # secrets はあらゆる拡張子に入りうるため glob を付けない
    - name: gitleaks
      run: gitleaks git --staged --config=.gitleaks.toml --redact

pre-push:
  jobs:
    - name: format
      glob:
        - "*.{js,jsx,ts,tsx,json,jsonc}"
        - "*.{md,yml,yaml}"
        - "*.lua"
        - "*.sh"
        - "*.toml"
        - "*.py"
      run: mise run check:format
    # CI の check:lint との差は lint:links（ネットワーク依存で遅い）を外していること
    - name: lint
      glob:
        - "*.{js,jsx,ts,tsx,json,jsonc}"
        - "*.{md,yml,yaml}"
        - "*.lua"
        - "*.sh"
        - "*.py"
        - "Dockerfile*"
      run: mise run check:lint:quick
    - name: test-ts
      glob:
        - "bin/**"
        - "scripts/**"
        - "zsh/**"
        - "mise/lib/**"
        - "mise/local-tasks/**"
        - ".mise.toml"
      run: mise run test:ts
    - name: test-lua
      glob: "*.lua"
      run: mise run test:lua
    # ci:gitleaks は push 対象の拡張子ではなく git 履歴全体を走査するため glob を付けない
    - name: gitleaks
      run: mise run ci:gitleaks
