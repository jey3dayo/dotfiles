project:
  name: "dotfiles"
  language: "ja"

metadata:
  # canonical は OKF 互換の YAML frontmatter。正本は docs/documentation.md。
  required_fields:
    - "type"

  recommended_fields:
    - "title"
    - "description"
    - "resource"
    - "tags"
    - "timestamp"
    - "audience"
    - "owner"

  # 移行期間中のみ有効な旧形式。frontmatter と併存する場合は frontmatter が優先。
  legacy_aliases:
    - "最終更新"
    - "対象"
    - "タグ"

  formats:
    date: "YYYY-MM-DD"
    tags: "one per list item, tier-prefixed (category/, layer/, ...)"

  freshness:
    warning_days: 180

tags:
  tier_system:
    - "category/"
    - "layer/"
    - "environment/"
    - "audience/"
    - "tool/"

  min_required:
    - "category/"
    - "layer/"

  max_recommended: 5

  reference_file: "references/tag-taxonomy.md"

size:
  recommended: 500
  warning: 1000
  hard_limit: 2000

quality:
  links:
    validate: true
    update_readme: false

integration:
  rules_file: ".claude/rules/documentation-rules.md"
  docs_hub: "docs/README.md"

response:
  language: "ja"
  format: "technical"
